spring:
  datasource:
    url: jdbc:h2:mem:auth_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cloud:
    config:
      enabled: false
  config:
    import: ""

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-key-for-jwt-signing-in-unit-and-integration-tests-only
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000
