# Activated on every service via SPRING_PROFILES_ACTIVE=docker in
# docker-compose.yml. Overrides hostnames from localhost to the
# docker-compose service names so containers can reach each other
# over the compose network.

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

spring:
  kafka:
    bootstrap-servers: kafka:9092
  data:
    redis:
      host: redis
      port: 6379
