spring:
  datasource:
    url: jdbc:h2:mem:product_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cloud:
    config:
      enabled: false
  config:
    import: ""
  # Falls back to Spring Boot's auto-configured in-memory
  # ConcurrentMapCacheManager (see RedisCacheConfig's @ConditionalOnProperty) —
  # exercises the @Cacheable/@CacheEvict logic without needing a real Redis.
  cache:
    type: simple

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-key-for-jwt-signing-in-unit-and-integration-tests-only
