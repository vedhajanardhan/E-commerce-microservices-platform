spring:
  datasource:
    url: jdbc:h2:mem:user_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cloud:
    config:
      enabled: false
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 1000
  config:
    import: ""

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-key-for-jwt-signing-in-unit-and-integration-tests-only
